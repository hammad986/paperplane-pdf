[extend]
useDefault = true

[[rules]]
id = "paperplane-admin-fallback"
description = "Hardcoded admin credential fallback"
regex = '''(?i)(?:getenv|environ\.get)\(\s*["']PAPERPLANE_ADMIN_(?:KEY|CODE)["']\s*,\s*["']([^"'\r\n]+)["']'''
secretGroup = 1

  [[rules.allowlists]]
  description = "The isolated history-preparation mirror replaces the compromised value with this literal marker."
  regexTarget = "line"
  regexes = ['''(?i)(?:getenv|environ\.get)\(\s*["']PAPERPLANE_ADMIN_(?:KEY|CODE)["']\s*,\s*["']\[REDACTED\]["']\s*\)''']

  [[rules.allowlists]]
  description = "This regression test intentionally assembles a fake fallback string to verify the detector."
  paths = ['''tests/test_launch_audit_v14\.py$''']

[[rules]]
id = "paperplane-compose-admin-fallback"
description = "Hardcoded Compose admin credential fallback"
regex = '''(?i)PAPERPLANE_ADMIN_(?:KEY|CODE)\s*:\s*["']?\$\{PAPERPLANE_ADMIN_(?:KEY|CODE):-([^}]+)\}'''
secretGroup = 1

  [[rules.allowlists]]
  description = "The regression test assembles a synthetic fallback string to verify that the detector catches it."
  paths = ['''tests/test_launch_audit_v14\.py$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Documentation examples read credentials from the environment."
  regexTarget = "match"
  regexes = ['''\$\{?PAPERPLANE_API_KEY\}?''', '''(?i)(?:YOUR|REPLACE|EXAMPLE|PAPERPLANE)[A-Z0-9_<> -]{0,32}API[A-Z0-9_<> -]{0,16}KEY''']

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "The uploaded certificate private-key parameter is a variable name, not a key value."
  regexTarget = "line"
  regexes = ['''save_upload_spooled\s*\(\s*custom_key\s*,\s*key_path''']

  [[rules.allowlists]]
  description = "These files contain synthetic idempotency values in API documentation and local retry-test evidence."
  paths = [
    '''docs/API_GUIDE\.md$''',
    '''docs/TEST_EVIDENCE\.md$''',
    '''reports/launch-audit-v23/browser-id106-idempotent-submit-retry\.json$'''
  ]
