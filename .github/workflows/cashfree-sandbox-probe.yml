name: Daily Cashfree sandbox checkout probe

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sandbox-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CASHFREE_ENV: TEST
      CASHFREE_APP_ID: ${{ secrets.CASHFREE_TEST_APP_ID }}
      CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cashfree TEST credentials
        run: |
          if [ -z "$CASHFREE_APP_ID" ] || [ -z "$CASHFREE_SECRET_KEY" ]; then
            echo "::error::Cashfree TEST credentials are not configured."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser probe dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Create unpaid test order and verify checkout drop
        run: python scripts/cashfree_sandbox_smoke.py --verify-drop
      - name: Alert repository owner once when the probe fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/alert_cashfree_probe_failure.py
